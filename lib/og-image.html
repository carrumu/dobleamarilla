<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imagen para compartir</title>
<!-- Fuente de og-image.png: abrir con el servidor local a 1200x630 y hacer captura de .og -->
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#fff}
.og{width:1200px;height:630px;display:grid;grid-template-columns:560px 1fr;gap:28px;align-items:center;padding:56px 56px 56px 64px;box-sizing:border-box;background:#f4f4f2;font-family:"Schibsted Grotesk",sans-serif;color:#111110}
.og img.logo{height:46px;width:auto;margin-bottom:34px}
h1{margin:0 0 18px;font-weight:800;font-size:62px;line-height:1.02;letter-spacing:-.025em}
p{margin:0;font-size:24px;line-height:1.35;color:#3d3d3a}
.pill{display:inline-block;margin-top:26px;background:#FFD60A;font-weight:800;font-size:20px;border-radius:999px;padding:9px 18px}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph img{width:100%;border-radius:14px;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.06)}
</style>
</head>
<body>
<div class="og">
  <div>
    <img class="logo" src="../img/logo.svg" alt="">
    <h1>Equipaciones de fútbol personalizadas</h1>
    <p>Escudo, patrocinador, nombre y dorsal incluidos. Desde una unidad.</p>
    <span class="pill">Desde 26,99 €</span>
  </div>
  <div class="ph">
    <img src="../img/catalogo/m05-6.webp" alt=""><img src="../img/catalogo/m04-3.webp" alt="">
    <img src="../img/catalogo/m07-2.webp" alt=""><img src="../img/catalogo/m01-1.webp" alt="">
  </div>
</div>
</body>
</html>
